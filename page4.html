<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forest Battle</title>
<style>
body{
    background-image: url('dead.jpeg')
}
.top-right-button {
     position: fixed;
        top: 20px;
        right: 20px;

        background-color: #061a3a;
        color: rgb(252, 249, 255);


        border: 2px solid black;
        border-radius: 30px;
border-color: black;
        font-family: Georgia, serif;
        font-size: 18px;

        cursor: pointer;

        box-shadow: 0 4px 0 black;
        transition: 0.1s;
    }

  :active {
        transform: translateY(4px);
        box-shadow: 0 0 0 black;
    }
</style>
<button class="top-right-button">
    The heavy rain hammered against the leaves overhead as Itachi Uchiha slowly tilted his straw hat, his crimson Sharingan glowing through the dark. "Do not speak, just listen," Itachi commanded calmly. "Three nights ago, the Scroll of Forbidden Seals was stolen from the Leaf village; a rogue ninja cell is moving it through the northern valley right now, and though my part in this is finished, those secrets must not fall into the wrong hands." In a flash of wind and black feathers, he vanished, leaving you to sprint into the dark forest where you were suddenly ambushed by three exploding kunai. Ducking the blast, you faced the scarred rogue ninja who carried the massive, glowing scroll on his back. As he lunged with a jagged blade, you quickly swapped places with a shadow clone, dropping from the tree canopy above to slam a crackling Rasengan directly into his back. The explosive shockwave blasted him into the mud completely unconscious, allowing you to easily unbuckle the stolen Scroll of Forbidden Seals and secure it safely over your shoulder,and smile knowing that you won and had the perfect day ever.
</button>
