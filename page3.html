<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forest Battle</title>

 <style>
 body {
  background-image: url(hehe.jpeg);
 background-size: cover;
 background-repeat: no-repeat;
  background-attachment: fixed;
 background-position: center;

            margin: 0;
            min-height: 100vh;
        }

          button {
      background-color: #061a3a;
      border-radius: 30px;
      border: 2px solid black;
      cursor: pointer;
      box-shadow: 0 4px 0 rgb(2, 0, 0);
      transition: all 0.05s ease-in-out; 
      font-family: 'Cinzel', serif;
      color: white;
      margin-top: 10px;
      max-width: 500px; 
      width: 90%;   
      padding: 20px; 
      margin-left: 900px;
      display: flex;
      flex-direction: column;    
      justify-content: center;   
      align-items: center;       
      text-align: center; 
      font-size: 1.2rem;       
      line-height: 1.4;         
      word-break: break-word;   
    }

    button:active {
      box-shadow: 0 0 0 rgb(77, 6, 18);
      transform: translateY(4px);
      background-color: rgb(0, 0, 0);
    }
  </style>
</head>
<body>

    <button onclick="window.location.href='page4.html';">
        Tightening your gear, you sprinted north into the dense,
        dark thicket of the forest. The mud sucked at your boots,
        and the wind howled through the canopy, masking the sounds of the wilderness.
        Minutes bled into hours as you tracked the faint signs of a passing squad through the brush.
        Suddenly, the hair on the back of your neck stood up.
        A sharp hiss sliced through the sound of the rain. Instinct took over,
        and you threw yourself backward onto the wet earth just as three explosive
        kunai slammed into the tree trunk where your head had been a second ago.
        A deafening blast shook the forest floor, showering you in splinters and smoke.
        From the branches above, a tall, scarred rogue ninja dropped heavily onto
        a massive log, blocking your path.
        Wrapped across his back was a massive, glowing parchment—the stolen Scroll of Forbidden Seals.
    
        He drew a jagged, oversized blade and locked his eyes onto yours,
        a wicked smirk spreading across his face.   
        "Well, well," the rogue sneered, wiping rainwater from his eyes.
        "I thought I smelled Akatsuki rat trailing me.
        If you came all this way to play hero and take back this scroll,
        I hope you're ready to die for it."
    </button>


</body>
</html>
